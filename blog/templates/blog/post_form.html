{% extends 'catalog/base.html' %}

{% block title %}{% if form.instance.pk %}Редактирование{% else %}Новая запись{% endif %} — Блог{% endblock %}

{% block content %}
<div class="container py-4">
  <h1 class="mb-3">{% if form.instance.pk %}Редактировать запись{% else %}Новая запись{% endif %}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Сохранить</button>
  </form>
</div>
{% endblock %}
