{% extends 'catalog/base.html' %}

{% block title %}Удалить запись — Блог{% endblock %}

{% block content %}
<div class="container py-4">
  <h1 class="mb-3">Удалить запись</h1>
  <p>Вы уверены, что хотите удалить «{{ object.title }}»?</p>
  <form method="post">
    {% csrf_token %}
    <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    <button class="btn btn-danger" type="submit">Удалить</button>
  </form>
</div>
{% endblock %}
