{% extends 'catalog/base.html' %}

{% block title %}Блог — список{% endblock %}

{% block content %}
<div class="container py-4">
  <h1 class="mb-3">Блог</h1>
  <a class="btn btn-primary mb-3" href="{% url 'blog:post_create' %}">Новая запись</a>
  <div class="row">
    {% for post in posts %}
    <div class="col-md-4">
      <div class="card mb-4">
        {% if post.preview %}
          <img src="{{ post.preview.url }}" class="card-img-top" alt="{{ post.title }}">
        {% endif %}
        <div class="card-body">
          <h5 class="card-title">{{ post.title }}</h5>
          <p class="card-text text-muted">Просмотры: {{ post.views_count }}</p>
          <a href="{% url 'blog:post_detail' post.pk %}" class="btn btn-outline-primary">Читать</a>
        </div>
      </div>
    </div>
    {% empty %}
      <p>Публикаций пока нет.</p>
    {% endfor %}
  </div>
{% endblock %}
