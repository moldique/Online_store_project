{% extends 'catalog/base.html' %}

{% block title %}Удалить товар - Skystore{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-3">Удалить товар</h1>
    <p>Вы уверены, что хотите удалить товар "{{ object.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Да, удалить</button>
        <a class="btn btn-outline-secondary" href="{% url 'index' %}">Отмена</a>
    </form>
</div>
{% endblock %}
